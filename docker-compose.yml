services:
  mysql:
    image: mysql:8.0
    container_name: paylink-mysql
    environment:
      MYSQL_DATABASE: paylink
      MYSQL_USER: paylink_user
      MYSQL_PASSWORD: paylink_pass
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: paylink-app
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/paylink?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: paylink_user
      SPRING_DATASOURCE_PASSWORD: paylink_pass
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: