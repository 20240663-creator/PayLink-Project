spring.application.name=paylink-backend

# Database connection (reads from Docker environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/paylink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paylink_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:paylink_pass}

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true